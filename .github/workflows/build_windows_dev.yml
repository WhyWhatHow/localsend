name: Build Windows (dev)

# Manual only. Produces an unsigned win_x64 "runner Release" archive you can
# download and run locally, without requiring code-signing secrets.
on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build_windows:
    runs-on: windows-latest

    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Dependencies (app)
        working-directory: app
        run: flutter pub get

      - name: Compile for Windows
        working-directory: app
        run: flutter build windows

      - name: Package Release folder
        working-directory: app
        run: |
          Copy-Item ../support/build/windows/x64/msvcp140.dll build/windows/x64/runner/Release/
          Copy-Item ../support/build/windows/x64/vcruntime140.dll build/windows/x64/runner/Release/
          Copy-Item ../support/build/windows/x64/vcruntime140_1.dll build/windows/x64/runner/Release/
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath localsend_windows_x64_dev.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: localsend-windows-x64-dev
          path: app/localsend_windows_x64_dev.zip
          if-no-files-found: error